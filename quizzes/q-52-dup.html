    <script>
    initQuiz('q-52-dup', [
        {
            question: "重複報告（dup）を回避するための事前チェックで確認すべき3つの軸はどれか？",
            options: [
                "CVSSスコア + CWE番号 + 影響を受けるバージョン",
                "Advisory/CVE + PR/Commit（コード修正） + Issue（バグトラッカー）",
                "HackerOne + Bugcrowd + huntr（3プラットフォームの横断チェック）",
                "Google検索 + Twitter検索 + GitHub検索"
            ],
            answer: 1,
            explanation: "dup checkの3軸は：1)Advisory/CVE（GHSA、NVD等に既に公開されているか）、2)PR/Commit（修正コミットやPRが既にマージされているか、side-effect fix PRも含む）、3)Issue（バグトラッカーに既に報告されているか）。この3軸を漏らすと「既に修正済み」「既に報告済み」のdupを踏む。特にside-effect fixは見落としやすい。"
        },
        {
            question: "HackerOneにおいて、dup（重複報告）がSignal（研究者の評価スコア）に与える影響として正しいのはどれか？",
            options: [
                "dupは-2のペナルティが発生する",
                "dupはSignal計算から除外される（正にも負にも影響しない）",
                "早期dupは+2、遅延dupは-5",
                "dupは常に-5のペナルティが発生する"
            ],
            answer: 1,
            explanation: "HackerOneのSignal計算では、dupは除外される（計算に含まれない）。つまりdupを受けてもSignalは下がらない。Signalを下げるのはN/A（Not Applicable）やSpamの判定であり、-5のペナルティがある。このためdupは「時間の無駄」ではあるが「評判の毀損」にはならない。一方N/Aは積極的に避けるべき。"
        },
        {
            question: "HackerOneでN/A（Not Applicable）判定を受けた場合のSignalへの影響と、その回避が重要な理由は何か？",
            options: [
                "+2のボーナス（報告の質に問題がないことを示すため）",
                "-5のペナルティ。低Signalはプライベートプログラムへの招待機会を減少させる",
                "影響なし（N/AはSignal計算から除外される）",
                "-1の軽微なペナルティ（重複時と同程度）"
            ],
            answer: 1,
            explanation: "N/Aは-5のSignalペナルティを受ける。これはBB活動で最も避けるべき判定。理由：Signalが低いと1)プライベートプログラム（高額報酬が多い）への招待が来なくなる、2)トリアージャーが報告を真剣に検討しなくなる、3)アカウントの信頼性が低下する。N/Aを避けるために、報告前の十分な検証と、推測（speculation）を排したエビデンスベースの報告が必須。"
        },
        {
            question: "HackerOneのプライベートプログラムに提出された非公開レポートのdup状況を外部から事前検知できない理由は何か？",
            options: [
                "HackerOneのAPIがレート制限されているため",
                "プライベートレポートはHacktivity（公開フィード）やダッシュボードに表示されず、提出者とプログラム関係者のみが閲覧可能なため",
                "レポートが暗号化されて保存されているため",
                "プライベートプログラムの存在自体が非公開のため"
            ],
            answer: 1,
            explanation: "HackerOneではプライベートプログラムへの報告は完全に非公開。Hacktivity（研究者間で共有される公開フィード）にも表示されず、プログラムの公開ダッシュボードにも出ない。そのため「この脆弱性を既に誰かが報告したか」を外部から判断することが構造的に不可能。これがprivate programでのdup率が読めない根本理由。"
        },
        {
            question: "IssueHuntの日本バグバウンティ市場におけるポジションとして正しいのはどれか？",
            options: [
                "日本唯一のBBプラットフォームで、政府機関のみを対象としている",
                "日本No.1のBBプラットフォームで、16の有料パブリックプログラム（SORACOM/ABEMA/bitFlyer/LINE WORKS/Tapple等）を運営している",
                "HackerOneの日本代理店として日本企業のプログラムを仲介している",
                "OSS専門のプラットフォームで、huntr.comの日本版として運営されている"
            ],
            answer: 1,
            explanation: "IssueHuntは日本No.1のバグバウンティプラットフォーム。SORACOM、ABEMA、bitFlyer、LINE WORKS、Tapple等の16の有料パブリックプログラムを運営している。HackerOneやBugcrowdとは独立した国産プラットフォームであり、日本企業特有の要件（日本語対応、国内法準拠等）に対応している。"
        }
    ]);
    </script>
