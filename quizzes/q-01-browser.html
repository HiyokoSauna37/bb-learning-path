    <script src="../assets/quiz.js"></script>
    <script>
    initQuiz('q-01-browser', [
        {
            question: "Same-Origin Policy (SOP) が実際に防止するのは次のうちどれか？",
            options: [
                "異なるオリジンへのリクエスト送信そのもの",
                "異なるオリジンからのレスポンスの読み取り",
                "異なるオリジンへのCookieの送信",
                "異なるオリジンの画像やスクリプトの読み込み"
            ],
            answer: 1,
            explanation: "SOPはクロスオリジンのリクエスト送信を防止しない（実際にリクエストは送られる）。防止するのはJavaScriptによるクロスオリジンのレスポンスの読み取りである。これがCSRFが可能な根本理由でもある：リクエストは送れるが、レスポンスは読めない。画像やスクリプトのembeddingはSOPで許可されている。"
        },
        {
            question: "CORSの設定ミス（Access-Control-Allow-Origin: *）が実際にセキュリティ上exploitableとなる条件は？",
            options: [
                "ワイルドカード(*)が設定されていれば常にexploitable",
                "ターゲットがCookie認証を使い、Access-Control-Allow-Credentials: trueが設定されている場合",
                "HTTPSではなくHTTPで通信している場合",
                "レスポンスにJSON形式のデータが含まれている場合"
            ],
            answer: 1,
            explanation: "CORS misconfigは、ターゲットがCookieベース認証を使い、credentials:trueが設定されている場合にexploitableとなる。ブラウザはAllow-Origin: * とAllow-Credentials: trueの組み合わせを拒否するため、実際には動的にOriginを反射する実装が危険。Bearerトークン等ヘッダー認証のみの場合、攻撃者のページからトークンを付与できないためexploit不可。"
        },
        {
            question: "SameSite=Lax属性が設定されたCookieについて正しいのはどれか？",
            options: [
                "すべてのクロスサイトリクエストでCookieが送信されない",
                "GETメソッドによるトップレベルナビゲーション（リンククリック等）ではCookieが送信される",
                "POSTメソッドでもフォーム送信であればCookieが送信される",
                "サブリクエスト（iframe、img等）でもCookieが送信される"
            ],
            answer: 1,
            explanation: "SameSite=Laxは、GETメソッドのトップレベルナビゲーション（ユーザーがリンクをクリック、アドレスバーに入力等）ではCookieを送信する。しかしPOSTフォーム送信、iframe、img、XMLHttpRequest等のサブリクエストではCookieを送信しない。これにより通常のリンク遷移は動作しつつ、CSRF攻撃の多くを防止できる。"
        },
        {
            question: "CSPのscript-src 'self'ディレクティブが防止するもの、しないものとして正しいのはどれか？",
            options: [
                "防止する：すべてのXSS攻撃 / 防止しない：特になし",
                "防止する：外部ドメインからのスクリプト読み込み / 防止しない：同一オリジンにアップロードされたJSファイルの実行",
                "防止する：インラインスクリプトの実行 / 防止しない：evalの使用",
                "防止する：すべてのJavaScript実行 / 防止しない：CSS injection"
            ],
            answer: 1,
            explanation: "script-src 'self'は外部ドメインのスクリプトとインラインスクリプトを防止する。しかし、同一オリジン上にJSファイルをアップロードできる場合（ファイルアップロード機能等）、そのスクリプトは実行可能。また、JSONPエンドポイントが同一オリジンに存在する場合もバイパス可能。'self'は万能ではない。"
        },
        {
            question: "HttpOnly属性がCookieに設定されている場合、具体的に何から保護されるか？",
            options: [
                "CSRF攻撃によるCookieの不正利用",
                "XSS攻撃におけるdocument.cookie経由のCookie窃取",
                "中間者攻撃によるCookieの傍受",
                "ブラウザのデベロッパーツールからのCookie閲覧"
            ],
            answer: 1,
            explanation: "HttpOnlyはJavaScript（document.cookie）からのCookieアクセスを防止する。XSSがあってもCookieの値を直接読み取れない。ただしCSRFは防げない（リクエスト時にCookieは自動送信される）。中間者攻撃はSecure属性、ネットワーク暗号化はHTTPSが担当。デベロッパーツールはブラウザのUI機能でありJS APIではないため閲覧可能。"
        }
    ]);
    </script>
