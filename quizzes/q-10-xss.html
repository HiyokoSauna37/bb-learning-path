        </div>

        <div class="page-nav" style="margin-top:2rem;">
            <a href="../modules/10-xss.html">&larr; Module に戻る</a>

    <script src="../assets/quiz.js"></script>
    <script>
    initQuiz('q-10-xss', [
        {
            "question": "保存済みコメントを API が JSON で返し、ブラウザーがその本文を HTML として描画する。レビュー記録として最も正確なのは？",
            "options": [
                "データベースから来たので、利用者が決めた値は経路に含まれない",
                "応答に値が入っているので Reflected だけを調べる",
                "保存した人から閲覧者への経路と、ブラウザーが選んだ sink の両方を調べる",
                "JSON の解析時点で、表示先の安全性が決まる"
            ],
            "answer": 2,
            "explanation": "Stored は値が後から読み出されること、DOM-based はブラウザー側のコードが解釈先を選ぶことを表す。JSON の解析後も文字列の由来は変わらない。"
        },
        {
            "question": "検索結果を共有したい。URL のフラグメントを読み取り、見出しに元の文字をそのまま表示する。適切な経路は？",
            "options": [
                "location.hash → URL としてデコード → 見出しの textContent",
                "location.hash → HTTPS 判定 → 見出しの innerHTML",
                "見出しの textContent → デコード → location.hash",
                "location.hash → HTML エンコード → 見出しの textContent"
            ],
            "answer": 0,
            "explanation": "フラグメントが source、見出しへの代入が sink。デコードは URL 表現を文字に戻す処理。textContent は文字列をそのまま表示するので、ここで先に HTML エンコードすると元の文字と異なる表示になる。"
        },
        {
            "question": "投稿本文では強調を許可し、投稿者が付けた属性はすべて取り除きたい。修正後のテストとして適切なのは？",
            "options": [
                "応答の Content-Type だけを確認する",
                "元の文字列に特定のタグ名が含まれないことを確認する",
                "全タグが画面に文字として見えることを確認する",
                "最終 DOM で強調要素が残り、その要素の属性が消えたことを確認する"
            ],
            "answer": 3,
            "explanation": "リッチテキストの要件は、許可した構造を残すこと。サニタイザーのポリシーを確認し、実際の表示先で許可した構造と除外した属性の両方を検証する。"
        },
        {
            "question": "表の行を文字列に戻し別の親要素で再解析すると、ブラウザーが tbody を補った。何が分かったか？",
            "options": [
                "DOM が変化したため、mXSS が成立した",
                "解釈の文脈で木が変わる。実行可能な構造が生じたかは別途確認する",
                "サニタイズ済みの文字列は、どこで再解析しても同じ木になる",
                "DOM が変わったため、保存型の脆弱性がある"
            ],
            "answer": 1,
            "explanation": "tbody の補完は通常の HTML 解析でも起きる。mXSS を調べるときは検査時の木と再解析後の木を比較し、後者に許可されていない実行可能な構造が生じるかを見る。"
        },
        {
            "question": "CSP がインラインスクリプトの実行を拒否した。検索結果の修正を完了と判断する前に何を確認する？",
            "options": [
                "CSP の違反通知件数だけを数える",
                "保存期間を短くすればよい",
                "検索語が最終表示先でテキストとして扱われ、正しい表示も保たれることを確認する",
                "URL を一度デコードしたことだけを確認する"
            ],
            "answer": 2,
            "explanation": "CSP は実行を制限する追加の防御層。表示先で値をどう解釈するかは別に検証する。見出しの子ノードと表示文字を確認すれば、修正と機能の両方を確かめられる。"
        }
    ]);
    </script>
</body>
</html>
